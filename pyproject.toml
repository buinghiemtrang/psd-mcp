[project]
name = "psd-mcp"
version = "0.1.0"
description = "MCP server: đọc PSD, xuất sprite, render và so ảnh để ráp UI Unity"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "psd-tools[composite]>=1.10",
    "pillow>=10",
    "numpy>=1.26",
]

[project.scripts]
psd-mcp = "psd_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
